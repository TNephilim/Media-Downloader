<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Downloader</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; padding: 10px; background: #070c14; color: #e7edf7; overflow: hidden; }
    main { height: 335px; padding: 12px 16px 14px; display: grid; grid-template-rows: auto 44px 42px 10px 48px 1fr 34px; gap: 8px; background: #101826; border: 1px solid #243244; }
    header { display: flex; align-items: baseline; justify-content: space-between; }
    h1 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 700; letter-spacing: 0; }
    .version { color: #8290a8; font-size: 12px; }
    .input-area { display: grid; grid-template-columns: 1fr 68px 70px 108px; gap: 8px; min-height: 44px; }
    textarea { width: 100%; height: 44px; resize: none; border: 1px solid #3a475b; outline: none; background: #182332; color: #f7fafc; padding: 5px 12px; font: 13px/16px "Segoe UI", Arial, sans-serif; overflow: hidden; }
    textarea:focus { border-color: #4c93ff; }
    .side-actions { display: contents; }
    .side-actions button { height: 44px; }
    button { border: 1px solid #415068; border-radius: 4px; background: #202d3e; color: #edf3fb; font: 13px "Segoe UI", Arial, sans-serif; cursor: pointer; transition: background 120ms ease, border-color 120ms ease; }
    button:hover:not(:disabled) { background: #2b3b51; border-color: #6381a9; }
    button:disabled { opacity: .48; cursor: default; }
    .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .modes button { height: 42px; border-color: #3b82f6; background: #2563d0; color: #ffffff; font-size: 14px; font-weight: 700; }
    .modes button:hover:not(:disabled) { background: #1d4ed8; border-color: #60a5fa; }
    .modes button:disabled { background: #1e3a6f; border-color: #284878; color: #9fb5d8; }
    .progress-track { height: 10px; background: #1b2736; border: 1px solid #344258; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #22c55e; transition: width 160ms linear; }
    .progress-fill.running { width: 38%; animation: pulse 1.05s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: translateX(-30%); } to { transform: translateX(170%); } }
    .state { height: 30px; display: grid; place-items: center; border: 1px solid #16834b; background: #052e1b; color: #4ade80; font-weight: 700; font-size: 14px; }
    .state.done { background: #112d49; color: #a9d8ff; }
    .state.error { background: #440d12; color: #fec5c9; }
    .state.cancelled { background: #2c2a2b; color: #ded8d0; }
    .status { height: 18px; margin-top: 5px; color: #aab7ca; font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { display: flex; justify-content: space-between; align-items: center; }
    footer button { height: 34px; padding: 0 12px; }
    #cancel { color: #ffb4b9; }
    .drop-active textarea { border-color: #4c93ff; background: #1c2c40; }
  </style>
</head>
<body>
  <main id="app">
    <header><h1>Media Downloader</h1><span class="version">v1.1.5</span></header>
    <section class="input-area" id="drop-zone">
      <textarea id="input" aria-label="Media links or file paths" spellcheck="false" placeholder="Paste links, drop media files, or choose files"></textarea>
      <div class="side-actions">
        <button id="clear" title="Clear text box">Clear</button>
        <button id="paste" title="Paste from clipboard">Paste</button>
        <button id="choose" title="Choose media files">Choose File</button>
      </div>
    </section>
    <section class="modes">
      <button data-mode="video">Download Video</button>
      <button data-mode="mp3">Download Audio</button>
      <button data-mode="gif">Download GIF</button>
      <button data-mode="frames">Extract Frames</button>
    </section>
    <div class="progress-track" aria-label="Download progress"><div class="progress-fill" id="progress"></div></div>
    <div><div class="state" id="phase">READY</div><div class="status" id="status">No downloads currently</div></div>
    <footer><button id="folder">Open Downloads Folder</button><button id="cancel" disabled>Cancel Download</button></footer>
  </main>
  <script>
    const input = document.querySelector('#input');
    const phase = document.querySelector('#phase');
    const status = document.querySelector('#status');
    const progress = document.querySelector('#progress');
    const cancel = document.querySelector('#cancel');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const app = document.querySelector('#app');
    const send = payload => window.external.sendMessage(JSON.stringify(payload));
    const setFiles = files => { if (files?.length) input.value = files.join('\n'); };

    document.querySelector('#clear').onclick = () => input.value = '';
    document.querySelector('#paste').onclick = async () => { try { input.value = await navigator.clipboard.readText(); } catch { } };
    document.querySelector('#choose').onclick = () => send({ action: 'choose' });
    document.querySelector('#folder').onclick = () => send({ action: 'openDownloads' });
    cancel.onclick = () => send({ action: 'cancel' });
    modeButtons.forEach(button => button.onclick = () => send({ action: 'start', mode: button.dataset.mode, input: input.value }));

    const dropZone = document.querySelector('#drop-zone');
    ['dragenter', 'dragover'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); app.classList.add('drop-active'); }));
    ['dragleave', 'drop'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); app.classList.remove('drop-active'); }));
    dropZone.addEventListener('drop', event => {
      const paths = [...event.dataTransfer.files].map(file => file.path).filter(Boolean);
      if (paths.length) send({ action: 'files', files: paths });
    });

    window.external.receiveMessage(message => {
      const event = JSON.parse(message);
      if (event.type === 'files') { setFiles(event.files); return; }
      if (event.type === 'ready') return;
      if (event.type === 'error') {
        phase.textContent = 'DOWNLOAD FAILED'; phase.className = 'state error'; status.textContent = event.message;
        progress.className = 'progress-fill'; progress.style.width = '0%'; cancel.disabled = true; modeButtons.forEach(button => button.disabled = false); return;
      }
      if (event.type !== 'state') return;
      const currentPhase = event.phase || 'downloading';
      phase.textContent = ({ downloading: 'DOWNLOADING', converting: 'CONVERTING', extracting: 'EXTRACTING FRAMES', done: 'DOWNLOAD COMPLETE', cancelled: 'DOWNLOAD CANCELLED' })[currentPhase] || 'DOWNLOADING';
      phase.className = `state ${currentPhase === 'done' ? 'done' : currentPhase === 'cancelled' ? 'cancelled' : ''}`;
      status.textContent = event.status || 'No downloads currently';
      if (event.indeterminate) { progress.className = 'progress-fill running'; progress.style.width = ''; }
      else { progress.className = 'progress-fill'; progress.style.width = `${Math.max(0, Math.min(100, event.progress ?? 0))}%`; }
      const busy = currentPhase === 'downloading' || currentPhase === 'converting';
      cancel.disabled = !busy; modeButtons.forEach(button => button.disabled = busy);
    });
  </script>
</body>
</html>
